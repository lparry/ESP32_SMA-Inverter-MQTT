name: Firmware and regression checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        configuration: [defaults, example, partial]
    env:
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
      - name: Install pinned build tools
        run: python -m pip install platformio==6.1.19
      - name: Select public configuration
        shell: bash
        run: |
          case '${{ matrix.configuration }}' in
            example) cp src/Config_example.h src/config_values.h ;;
            partial) printf '#define SCAN_RATE 45\n' > src/config_values.h ;;
          esac
      - name: Build ESP32 firmware
        run: pio run --environment espwroom32
      - name: Run host regression checks with sanitizers
        if: matrix.configuration == 'defaults'
        run: python tests/host/run.py
      - name: Test firmware release idempotency
        if: matrix.configuration == 'defaults'
        run: python tests/release/test_publish_firmware_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.configuration }}
          path: |
            .pio/build/espwroom32/firmware.elf
            .pio/build/espwroom32/firmware.bin

  # Preserve automatic main-branch releases; pull requests only run checks.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    # Keep pending publications instead of letting a late matrix run replace one.
    # GitHub's queue: max allows up to 100 pending runs; see the concurrency docs.
    concurrency:
      group: firmware-release
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: firmware-defaults
          path: firmware
      - name: Publish the next minor release
        env:
          GH_TOKEN: ${{ secrets.PLATFORMIO_RELEASE_TOKEN }}
        run: python scripts/publish_firmware_release.py
